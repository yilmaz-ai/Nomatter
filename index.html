<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Nomatter — Hello World</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --accent: #7c5cff;
      --accent-2: #24d6a3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(124, 92, 255, 0.30), transparent 32rem),
        radial-gradient(circle at 85% 85%, rgba(36, 214, 163, 0.18), transparent 28rem),
        #0b1020;
      color: #f7f8ff;
    }

    .card {
      width: min(92vw, 620px);
      padding: clamp(2rem, 7vw, 4rem);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      background: rgba(16, 22, 42, 0.72);
      box-shadow: 0 32px 90px rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.9rem;
      border: 1px solid rgba(36, 214, 163, 0.28);
      border-radius: 999px;
      background: rgba(36, 214, 163, 0.08);
      color: #a9ffe4;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
    }

    .status::before {
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 18px var(--accent-2);
      content: "";
    }

    h1 {
      margin: 1.5rem 0 0.5rem;
      font-size: clamp(3.2rem, 14vw, 7rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    p {
      min-height: 3rem;
      margin: 1.25rem auto 2rem;
      color: #bdc5dd;
      font-size: clamp(1rem, 3vw, 1.18rem);
      line-height: 1.6;
    }

    button {
      min-width: 10rem;
      padding: 1rem 1.5rem;
      border: 0;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), #a66cff);
      box-shadow: 0 16px 35px rgba(124, 92, 255, 0.32);
      color: white;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 42px rgba(124, 92, 255, 0.42);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    .counter {
      display: block;
      margin-top: 1rem;
      color: #77819d;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="status">GitHub bağlantısı canlı</span>
    <h1>Nomatter.</h1>
    <p id="message" aria-live="polite">Hello, world. İlk commit dünyaya geldi.</p>
    <button id="ship" type="button">Yardır</button>
    <small class="counter" id="counter">Henüz kaos yok.</small>
  </main>

  <script>
    const messages = [
      "Branch açıldı. Kod yola çıktı.",
      "Commit tamam. Makine homurdanıyor.",
      "Pull request kapıda. Çayları koy.",
      "No matter what, we ship."
    ];

    const button = document.querySelector("#ship");
    const message = document.querySelector("#message");
    const counter = document.querySelector("#counter");
    let clicks = 0;

    button.addEventListener("click", () => {
      clicks += 1;
      message.textContent = messages[(clicks - 1) % messages.length];
      counter.textContent = `${clicks} kez yardırıldı.`;
      document.documentElement.style.setProperty(
        "--accent",
        `hsl(${250 + (clicks * 23) % 95} 88% 66%)`
      );
    });
  </script>
</body>
</html>
